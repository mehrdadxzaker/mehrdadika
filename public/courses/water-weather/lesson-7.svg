<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc"><title id="title">Following the water</title><desc id="desc">A simplified water cycle shows evaporation upward from a lake, condensation in clouds, rain downward, and surface water flowing back to the lake. Other routes are omitted.</desc><defs><pattern id="paper" width="19" height="19" patternUnits="userSpaceOnUse"><path d="M0 3h19M3 0v19" stroke="#243b52" stroke-opacity=".025"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4a83a2"/></marker></defs><rect width="1000" height="640" fill="#f1eadc"/><rect x="22" y="22" width="956" height="596" rx="12" fill="url(#paper)" stroke="#d8cbb4"/><text x="55" y="65" font-family="Georgia,serif" font-size="16" fill="#243b52" text-anchor="start">WATER &amp; WEATHER  /  FIELD NOTES</text><text x="945" y="65" font-family="Georgia,serif" font-size="20" fill="#243b52" text-anchor="end">07</text><text x="55" y="117" font-family="Georgia,serif" font-size="32" fill="#243b52" text-anchor="start">One possible route through a cycle</text><circle cx="190" cy="207" r="46" fill="#d7a94e"/><path d="M55 430Q320 335 570 410L790 290 945 440V540H55Z" fill="#bccbb5"/><ellipse cx="288" cy="489" rx="190" ry="47" fill="#4a83a2"/><g transform="translate(650 229) scale(1.15)"><path d="M-110 30C-155 0-128-58-78-46C-69-111 18-118 45-62C104-88 143-28 111 10C153 53 83 80 45 61H-90C-127 61-142 41-110 30Z" fill="#dbe6de" stroke="#819988" stroke-width="3"/></g><path d="M283 416Q270 247 438 227" fill="none" stroke="#4a83a2" stroke-width="5" stroke-dasharray="8 8" marker-end="url(#arrow)"/><path d="M735 310V406" stroke="#4a83a2" stroke-width="5" marker-end="url(#arrow)"/><path d="M755 447Q626 493 497 496" fill="none" stroke="#4a83a2" stroke-width="5" marker-end="url(#arrow)"/><text x="296" y="321" font-family="Georgia,serif" font-size="23" fill="#243b52" text-anchor="start">evaporation</text><text x="527" y="177" font-family="Georgia,serif" font-size="23" fill="#243b52" text-anchor="start">condensation</text><text x="751" y="364" font-family="Georgia,serif" font-size="23" fill="#243b52" text-anchor="start">precipitation</text><text x="548" y="525" font-family="Georgia,serif" font-size="22" fill="#243b52" text-anchor="start">surface flow</text><path d="M55 572h890" stroke="#d8cbb4"/><text x="55" y="605" font-family="Georgia,serif" font-size="17" fill="#243b52" text-anchor="start">A simplified teaching diagram • English labels</text></svg>