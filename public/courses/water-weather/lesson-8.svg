<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc"><title id="title">Explain a new scene</title><desc id="desc">A new scene shows a wet cloth on a line, a puddle on the ground, and droplets outside a cold glass on a table. Dashed arrows symbolize invisible water vapor.</desc><defs><pattern id="paper" width="19" height="19" patternUnits="userSpaceOnUse"><path d="M0 3h19M3 0v19" stroke="#243b52" stroke-opacity=".025"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4a83a2"/></marker></defs><rect width="1000" height="640" fill="#f1eadc"/><rect x="22" y="22" width="956" height="596" rx="12" fill="url(#paper)" stroke="#d8cbb4"/><text x="55" y="65" font-family="Georgia,serif" font-size="16" fill="#243b52" text-anchor="start">WATER &amp; WEATHER  /  FIELD NOTES</text><text x="945" y="65" font-family="Georgia,serif" font-size="20" fill="#243b52" text-anchor="end">08</text><text x="55" y="117" font-family="Georgia,serif" font-size="32" fill="#243b52" text-anchor="start">Describe what you see. Explain why.</text><path d="M80 200H600" stroke="#665a43" stroke-width="4"/><path d="M135 201 160 383Q270 417 395 374L420 201Z" fill="#83b4c6"/><path d="M165 222 185 356M217 218 237 368M285 218 305 369M352 219 370 352" stroke="#f1eadc" stroke-width="4" opacity=".6"/><ellipse cx="260" cy="490" rx="111" ry="23" fill="#4a83a2"/><path d="M622 418H925M665 418V535M886 418V535" stroke="#ba8565" stroke-width="9"/><g transform="translate(773 308) scale(0.7)"><path d="M-75-80-56 110H56L75-80Z" fill="#e4ece4" stroke="#243b52" stroke-width="4"/><path d="M-65-5-54 108H54L65-5Z" fill="#83b4c6"/><ellipse cy="-5" rx="65" ry="13" fill="#b3d3d9"/><ellipse cy="-80" rx="75" ry="12" fill="none" stroke="#243b52" stroke-width="4"/></g><path d="M712 300.96 C704.64 310.24 705.92 315.68 712 315.68 C718.08 315.68 719.36 310.24 712 300.96Z" fill="#4a83