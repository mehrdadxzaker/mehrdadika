<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc"><title id="title">Where puddles go</title><desc id="desc">The same puddle is larger earlier and smaller later. Dotted upward arrows represent invisible water vapor leaving the liquid surface; runoff and infiltration are excluded.</desc><defs><pattern id="paper" width="19" height="19" patternUnits="userSpaceOnUse"><path d="M0 3h19M3 0v19" stroke="#243b52" stroke-opacity=".025"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4a83a2"/></marker></defs><rect width="1000" height="640" fill="#f1eadc"/><rect x="22" y="22" width="956" height="596" rx="12" fill="url(#paper)" stroke="#d8cbb4"/><text x="55" y="65" font-family="Georgia,serif" font-size="16" fill="#243b52" text-anchor="start">WATER &amp; WEATHER  /  FIELD NOTES</text><text x="945" y="65" font-family="Georgia,serif" font-size="20" fill="#243b52" text-anchor="end">04</text><text x="55" y="117" font-family="Georgia,serif" font-size="34" fill="#243b52" text-anchor="start">Earlier → later</text><circle cx="825" cy="180" r="44" fill="#d7a94e"/><path d="M55 460H945" stroke="#ba8565" stroke-width="5"/><ellipse cx="260" cy="443" rx="175" ry="42" fill="#4a83a2"/><ellipse cx="745" cy="443" rx="93" ry="27" fill="#4a83a2"/><text x="260" y="524" font-family="Georgia,serif" font-size="24" fill="#243b52" text-anchor="middle">earlier: larger puddle</text><text x="745" y="524" font-family="Georgia,serif" font-size="24" fill="#243b52" text-anchor="middle">later: smaller puddle</text><path d="M450 425H565" stroke="#ba8565" stroke-width="5" marker-end="url(#arrow)"/><path d="M680 388Q640 312 701 249M736 385Q715 300 749 245M790 390Q835 311 796 260" fill="none" stroke="#4a83a2" stroke-width="4" stroke-dasharray="8 9" marker-end="url(#arrow)"/><text x="540" y="183" font-family="Georgia,serif" font-size="28" fill="#243b52" text-anchor="start">evaporation</text><text x="530" y="220" font-family="Georgia,serif" font-size="20" fill="#243b52" text-anchor="start">dashed arrows = invisible vapor</text><path d="M55 572h890" stroke="#d8cbb4"/><text x="55" y="605" font-family="Georgia,serif" font-size="17" fill="#243b52" text-anchor="start">A simplified teaching diagram • English labels</text></svg>