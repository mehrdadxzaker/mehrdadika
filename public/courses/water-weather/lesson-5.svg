<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc"><title id="title">Drops on a cold glass</title><desc id="desc">A cold glass has liquid drops on the outside. Dashed arrows from the surrounding air indicate water vapor moving toward the cold surface, not water passing through the glass.</desc><defs><pattern id="paper" width="19" height="19" patternUnits="userSpaceOnUse"><path d="M0 3h19M3 0v19" stroke="#243b52" stroke-opacity=".025"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4a83a2"/></marker></defs><rect width="1000" height="640" fill="#f1eadc"/><rect x="22" y="22" width="956" height="596" rx="12" fill="url(#paper)" stroke="#d8cbb4"/><text x="55" y="65" font-family="Georgia,serif" font-size="16" fill="#243b52" text-anchor="start">WATER &amp; WEATHER  /  FIELD NOTES</text><text x="945" y="65" font-family="Georgia,serif" font-size="20" fill="#243b52" text-anchor="end">05</text><text x="55" y="117" font-family="Georgia,serif" font-size="33" fill="#243b52" text-anchor="start">Air → cold surface → liquid drops</text><path d="M90 485H913" stroke="#ba8565" stroke-width="9"/><g transform="translate(620 318) scale(1.15)"><path d="M-75-80-56 110H56L75-80Z" fill="#e4ece4" stroke="#243b52" stroke-width="4"/><path d="M-65-5-54 108H54L65-5Z" fill="#83b4c6"/><ellipse cy="-5" rx="65" ry="13" fill="#b3d3d9"/><ellipse cy="-80" rx="75" ry="12" fill="none" stroke="#243b52" stroke-width="4"/></g><g transform="translate(607 262) scale(0.44)"><path d="M0-65 70-31 0 6-70-31Z" fill="#d9e7df"/><path d="M-70-31 0 6V85L-70 46Z" fill="#8fbacb"/><path d="M0 6 70-31V46L0 85Z" fill="#4a83a2"/><path d="M-55-28-8-51M-52-15-5 7" stroke="#fff" stroke-width="3" opacity=".65"/></g><path d="M521 300.1 C510.65 313.15 512.45 320.8 521 320.8 C529.55 320.8 531.35 313.15 521 300.1Z" fill="#4a83a2"/><path d="M533 360.3 C524.95 370.45 526.35 376.4 533 376.4 C539.65 376.4 541.05 370.45 533 360.3Z" fill="#4a83a2"/><path d="M715 330.1 C704.65 343.15 706.45 350.8 715 350.8 C723.55 350.8 725.35 343.15 715 330.1Z" fill="#4a83a2"/><path d="M707 393.3 C698.95 403.45 700.35 409.4 707 409.4 C713.65 409.4 715.05 403.45 707 393.3Z" fill="#4a83a2"/><circle cx="245" cy="235" r="5" fill="#4a83a2"/><circle cx="320" cy="220" r="5" fill="#4a83a2"/><circle cx="295" cy="270" r="5" fill="#4a83a2"/><circle cx="255" cy="310" r="5" fill="#4a83a2"/><circle cx="338" cy="312" r="5" fill="#4a83a2"/><circle cx="351" cy="264" r="5" fill="#4a83a2"/><path d="M350 257Q431 250 501 297M350 350Q430 340 509 365" stroke="#4a83a2" stroke-width="4" stroke-dasharray="7 9" fill="none" marker-end="url(#arrow)"/><text x="132" y="418" font-family="Georgia,serif" font-size="23" fill="#243b52" text-anchor="start">water vapor in the air</text><text x="690" y="210" font-family="Georgia,serif" font-size="23" fill="#243b52" text-anchor="start">cold glass</text><text x="770" y="371" font-family="Georgia,serif" font-size="23" fill="#243b52" text-anchor="start">liquid</text><text x="770" y="402" font-family="Georgia,serif" font-size="23" fill="#243b52" text-anchor="start">droplets</text><path d="M55 572h890" stroke="#d8cbb4"/><text x="55" y="605" font-family="Georgia,serif" font-size="17" fill="#243b52" text-anchor="start">A simplified teaching diagram • English labels</text></svg>