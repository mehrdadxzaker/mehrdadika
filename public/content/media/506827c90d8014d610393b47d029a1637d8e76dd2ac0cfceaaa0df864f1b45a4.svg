<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc"><title id="title">Solid, liquid and gas</title><desc id="desc">Three panels show solid ice, liquid water in a glass, and symbolic dots for invisible water vapor. The dots are representations, not visible vapor.</desc><defs><pattern id="paper" width="19" height="19" patternUnits="userSpaceOnUse"><path d="M0 3h19M3 0v19" stroke="#243b52" stroke-opacity=".025"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4a83a2"/></marker></defs><rect width="1000" height="640" fill="#f1eadc"/><rect x="22" y="22" width="956" height="596" rx="12" fill="url(#paper)" stroke="#d8cbb4"/><text x="55" y="65" font-family="Georgia,serif" font-size="16" fill="#243b52" text-anchor="start">WATER &amp; WEATHER  /  FIELD NOTES</text><text x="945" y="65" font-family="Georgia,serif" font-size="20" fill="#243b52" text-anchor="end">02</text><text x="55" y="117" font-family="Georgia,serif" font-size="34" fill="#243b52" text-anchor="start">One substance, three states</text><path d="M350 160V495M660 160V495" stroke="#d8cbb4"/><g transform="translate(202 290) scale(1.2)"><path d="M0-65 70-31 0 6-70-31Z" fill="#d9e7df"/><path d="M-70-31 0 6V85L-70 46Z" fill="#8fbacb"/><path d="M0 6 70-31V46L0 85Z" fill="#4a83a2"/><path d="M-55-28-8-51M-52-15-5 7" stroke="#fff" stroke-width="3" opacity=".65"/></g><g transform="translate(505 300) scale(1.15)"><path d="M-75-80-56 110H56L75-80Z" fill="#e4ece4" stroke="#243b52" stroke-width="4"/><path d="M-65-5-54 108H54L65-5Z" fill="#83b4c6"/><ellipse cy="-5" rx="65" ry="13" fill="#b3d3d9"/><ellipse cy="-80" rx="75" ry="12" fill="none" stroke="#243b52" stroke-width="4"/></g><rect x="708" y="195" width="210" height="240" rx="15" fill="none" stroke="#83b4c6" stroke-dasharray="10 10"/><circle cx="765" cy="275" r="5" fill="#4a83a2"/><circle cx="840" cy="260" r="5" fill="#4a83a2"/><circle cx="815" cy="310" r="5" fill="#4a83a2"/><circle cx="775" cy="350" r="5" fill="#4a83a2"/><circle cx="858" cy="352" r="5" fill="#4a83a2"/><circle cx="871" cy="304" r="5" fill="#4a83a2"/><text x="200" y="470" font-family="Georgia,serif" font-size="26" fill="#243b52" text-anchor="middle">SOLID</text><text x="505" y="470" font-family="Georgia,serif" font-size="26" fill="#243b52" text-anchor="middle">LIQUID</text><text x="810" y="470" font-family="Georgia,serif" font-size="26" fill="#243b52" text-anchor="middle">GAS</text><text x="810" y="510" font-family="Georgia,serif" font-size="16" fill="#243b52" text-anchor="middle">Dots symbolize invisible vapor</text><path d="M55 572h890" stroke="#d8cbb4"/><text x="55" y="605" font-family="Georgia,serif" font-size="17" fill="#243b52" text-anchor="start">A simplified teaching diagram • English labels</text></svg>