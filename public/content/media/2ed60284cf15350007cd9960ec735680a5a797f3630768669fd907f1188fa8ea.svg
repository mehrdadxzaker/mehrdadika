<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc"><title id="title">Heating and cooling</title><desc id="desc">A left-to-right arrow labeled melting connects ice to liquid water; a right-to-left arrow labeled freezing connects liquid water to ice.</desc><defs><pattern id="paper" width="19" height="19" patternUnits="userSpaceOnUse"><path d="M0 3h19M3 0v19" stroke="#243b52" stroke-opacity=".025"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4a83a2"/></marker></defs><rect width="1000" height="640" fill="#f1eadc"/><rect x="22" y="22" width="956" height="596" rx="12" fill="url(#paper)" stroke="#d8cbb4"/><text x="55" y="65" font-family="Georgia,serif" font-size="16" fill="#243b52" text-anchor="start">WATER &amp; WEATHER  /  FIELD NOTES</text><text x="945" y="65" font-family="Georgia,serif" font-size="20" fill="#243b52" text-anchor="end">03</text><text x="55" y="117" font-family="Georgia,serif" font-size="34" fill="#243b52" text-anchor="start">The substance stays water</text><g transform="translate(240 320) scale(1.4)"><path d="M0-65 70-31 0 6-70-31Z" fill="#d9e7df"/><path d="M-70-31 0 6V85L-70 46Z" fill="#8fbacb"/><path d="M0 6 70-31V46L0 85Z" fill="#4a83a2"/><path d="M-55-28-8-51M-52-15-5 7" stroke="#fff" stroke-width="3" opacity=".65"/></g><g transform="translate(760 310) scale(1.1)"><path d="M-75-80-56 110H56L75-80Z" fill="#e4ece4" stroke="#243b52" stroke-width="4"/><path d="M-65-5-54 108H54L65-5Z" fill="#83b4c6"/><ellipse cy="-5" rx="65" ry="13" fill="#b3d3d9"/><ellipse cy="-80" rx="75" ry="12" fill="none" stroke="#243b52" stroke-width="4"/></g><path d="M370 245H630" stroke="#4a83a2" stroke-width="6" marker-end="url(#arrow)"/><text x="500" y="217" font-family="Georgia,serif" font-size="28" fill="#243b52" text-anchor="middle">melting</text><path d="M630 414H370" stroke="#4a83a2" stroke-width="6" marker-end="url(#arrow)"/><text x="500" y="462" font-family="Georgia,serif" font-size="28" fill="#243b52" text-anchor="middle">freezing</text><text x="225" y="516" font-family="Georgia,serif" font-size="24" fill="#243b52" text-anchor="middle">solid water</text><text x="760" y="516" font-family="Georgia,serif" font-size="24" fill="#243b52" text-anchor="middle">liquid water</text><path d="M55 572h890" stroke="#d8cbb4"/><text x="55" y="605" font-family="Georgia,serif" font-size="17" fill="#243b52" text-anchor="start">A simplified teaching diagram • English labels</text></svg>