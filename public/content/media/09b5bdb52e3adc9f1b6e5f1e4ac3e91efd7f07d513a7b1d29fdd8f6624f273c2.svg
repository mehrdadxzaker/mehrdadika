<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">Gravitational potential energy becomes motion in an ideal pendulum.</title>
<desc id="desc">The same pendulum is shown first raised at minus forty-five degrees as an amber ghost, then at its lowest point as a solid teal bob. Both cords share the fixed pivot at 288,82 and are exactly 260 units long. As the bob falls by its height difference, gravitational potential energy transfers to kinetic energy. Equal-height energy bars represent the same energy in two forms; this idealized diagram does not create energy.</desc>
<defs>
  <linearGradient id="steel" x1="0" x2="1"><stop stop-color="#9baeb4"/><stop offset=".42" stop-color="#657e89"/><stop offset="1" stop-color="#344d5c"/></linearGradient>
  <radialGradient id="bob" cx=".32" cy=".25" r=".82"><stop stop-color="#b5d0ce"/><stop offset=".35" stop-color="#709b9d"/><stop offset="1" stop-color="#355a67"/></radialGradient>
  <marker id="amber-arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 9 4.5 0 9 2.2 4.5Z" fill="#ce953a"/></marker>
  <marker id="height-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 7 3.5 0 7 1.7 3.5Z" fill="#a98047"/></marker>
  <marker id="teal-arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 9 4.5 0 9 2.2 4.5Z" fill="#537e84"/></marker>
</defs>
