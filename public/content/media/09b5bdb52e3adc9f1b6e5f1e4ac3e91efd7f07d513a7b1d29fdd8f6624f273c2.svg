<line x1="288" y1="82" x2="288.000000" y2="342.000000" stroke="#4f6770" stroke-width="3"/>
<path d="M120.875221 281.171555 A260 260 0 0 0 247.327039 338.798969" fill="none" stroke="#ce953a" stroke-width="4" stroke-linecap="round" marker-end="url(#amber-arrow)"/>
<circle cx="104.152237" cy="265.847763" r="28" fill="#d5a551" fill-opacity=".17" stroke="#c0924e" stroke-width="2" stroke-dasharray="5 4" opacity=".75"/>
<circle cx="288.000000" cy="342.000000" r="29" fill="url(#bob)" stroke="#3f626b" stroke-width="2"/>
<ellipse cx="278" cy="331" rx="7" ry="4" fill="#edf6ef" opacity=".38" transform="rotate(-35 278 331)"/>
