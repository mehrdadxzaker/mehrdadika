<path d="M58 265.847763 H104.152237 M58 342.000000 H288.000000" fill="none" stroke="#b5a17f" stroke-width="1.4" stroke-dasharray="4 6" opacity=".55"/>
<path d="M58 270.847763 V337.000000" fill="none" stroke="#a98047" stroke-width="1.6" marker-start="url(#height-arrow)" marker-end="url(#height-arrow)"/>
<text x="33" y="309" font-family="Georgia,serif" font-size="15" fill="#947140">Δh</text>
