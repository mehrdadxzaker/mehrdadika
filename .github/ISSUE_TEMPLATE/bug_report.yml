name: App bug
description: Report a reproducible application problem.
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include expected behavior and a short reproduction. Do not include private backups or credentials.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App and content version
  - type: input
    id: environment
    attributes:
      label: Browser, device and viewport
  - type: textarea
    id: evidence
    attributes:
      label: Screenshot or relevant error
      description: Remove personal information before attaching evidence.
