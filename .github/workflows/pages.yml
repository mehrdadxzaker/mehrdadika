name: Deploy GitHub Pages

on:
  workflow_dispatch:
    inputs:
      base_path:
        description: 'Leading/trailing slash, for example /mehrdadika/ or / for a custom domain'
        required: true
        default: '/mehrdadika/'

permissions:
  contents: read

env:
  NPM_CONFIG_MAXSOCKETS: 8

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Validate base path
        env:
          ATLAS_BASE: ${{ inputs.base_path }}
        run: |
          node --input-type=module -e 'const p = process.env.ATLAS_BASE; if (!/^\/(?:[A-Za-z0-9_-]+\/)*$/.test(p || "")) throw new Error("Use a safe leading/trailing-slash path");'
      - name: Install lockfile dependencies
        run: npm ci --no-audit --no-fund
        timeout-minutes: 5
      - run: npm test
        timeout-minutes: 5
      - run: npm run check:content
        timeout-minutes: 2
      - name: Build static application
        env:
          ATLAS_BASE: ${{ inputs.base_path }}
          VITE_REPO_URL: https://github.com/${{ github.repository }}
        run: npm run build
        timeout-minutes: 3
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static artifact
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published source revision
        env:
          DEPLOY_URL: ${{ steps.deployment.outputs.page_url }}
        timeout-minutes: 2
        run: |
          curl --fail --silent --show-error --retry 2 --retry-delay 3 --connect-timeout 10 --max-time 20 "${DEPLOY_URL%/}/build-info.json?run=${GITHUB_RUN_ID}" --output /tmp/mehrdadika-build-info.json
          node -e 'const data = JSON.parse(require("node:fs").readFileSync("/tmp/mehrdadika-build-info.json", "utf8")); if (data.revision !== process.env.GITHUB_SHA) throw new Error("Published source revision does not match this deployment"); console.log("Verified deployed source:", data.revision);'
